function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&x.version===1?x.data:clone(seed)}catch(e){return clone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify({version:1,data:data}))}
function money(n){if(n===null||n===undefined||n==="")return "—";return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:2}).format(Number(n))}
function date(s){if(!s)return "—";const a=s.split("-");return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:s}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tag(s){let cls="gray";if(/Validado|Identificado|Confirmad|Completa|Conciliada|Vinculado|Imputado|Revisado/i.test(s))cls="green";else if(/Pendiente|Provisional|Parcial|Observad|revisar|Esperando/i.test(s))cls="amber";else if(/Rechaz|Diferencia/i.test(s))cls="red";else if(/Por revisar|Propuesta/i.test(s))cls="blue";return '<span class="tag '+cls+'">'+esc(s)+'</span>'}

function btn(label,action,cls){return '<button class="btn '+(cls||"")+'" data-action="'+action+'">'+label+'</button>'}

function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function empty(title,desc){return '<div class="empty"><strong>'+title+'</strong>'+desc+'</div>'}

function newImputation(operation){
 const op=operation||"OP-0042";
 const body='<div class="notice info">Elegí el criterio para esta operación. Los datos se guardan localmente en la demo.</div><div class="form-grid">'+selectField("Operación","operation",data.purchases.map(x=>x.id+" · "+x.supplier))+selectField("Modalidad","mode",["Por porcentajes","Por importes","Por cantidades"])+field("Importe base (ARS)","total","1000000","1000000","number")+field("Cantidad base (si corresponde)","quantity","100","100","number")+'</div><div class="hint">Distribución de ejemplo: Empaque, Frigorífico y Administración. Completá los valores según la modalidad seleccionada.</div><div class="form-grid" style="margin-top:12px">'+field("Empaque","v1","62","62","number")+field("Frigorífico","v2","38","38","number")+field("Administración","v3","0","0","number")+'</div><p class="hint">Porcentajes: total 100. Importes: suma igual al importe base. Cantidades: suma igual a la cantidad base. Las cuentas y centros de costo oficiales todavía no están configurados en esta demo.</p>';
 modal("Nueva imputación",body,"Validar y guardar","save-imputation");
 const sel=document.querySelector('[name="operation"]');if(sel){const idx=data.purchases.findIndex(x=>x.id===op);if(idx>=0)sel.selectedIndex=idx}
}
function supplierDetail(id){
 const s=data.suppliers.find(x=>x.id===id);if(!s)return;
 modal("Ficha de proveedor",'<div class="kv"><div><label>Razón social</label><strong>'+esc(s.name)+'</strong></div><div><label>CUIT</label><strong>'+esc(s.tax||"Pendiente")+'</strong></div><div><label>Estado</label><strong>'+esc(s.status)+'</strong></div></div><p class="small muted">En la demo, la acción de alta central es simulada y local.</p><div class="notice info">Usuario: Contabilidad Demo. La autorización real dependerá de permisos individuales delegados.</div><div class="actions">'+(s.status==="Provisional"?'<button type="button" class="btn primary" data-action="centralize-supplier" data-id="'+s.id+'">Completar datos y registrar en Maestro Central (simulado)</button>':'')+'</div>',"Cerrar","close-modal");
}
function suggestions(docId){
 const d=data.docs.find(x=>x.id===docId);if(!d)return;
 const candidates=data.purchases.filter(p=>p.supplier===d.supplier&&p.id!==d.operation);
 const same=data.purchases.find(p=>p.id===d.operation);
 let list=[];
 if(same)list.push({p:same,why:"El comprobante ya figura relacionado con esta operación en los datos de demostración."});
 candidates.forEach(p=>list.push({p:p,why:"Coincidencia de proveedor. Revisar fecha, artículos y referencias antes de confirmar."}));
 const rows=list.length?list.map(x=>'<div class="list-row"><div class="grow"><strong>'+x.p.id+' · '+esc(x.p.description)+'</strong><span class="sub-text">'+esc(x.why)+'</span></div><button class="btn small" data-action="confirm-link" data-doc="'+d.id+'" data-operation="'+x.p.id+'">Confirmar vínculo</button></div>').join(""):empty("Sin coincidencias claras","Podés buscar manualmente o crear una operación nueva.");
 modal("Sugerencias de vinculación",'<div class="notice info"><strong>'+esc(d.type)+' '+esc(d.number)+'</strong>Proveedor: '+esc(d.supplier)+'. Las sugerencias nunca se confirman automáticamente.</div>'+rows,"Cerrar","close-modal");
}
function handleSubmit(form){
 const action=form.dataset.submit,fd=new FormData(form),v=Object.fromEntries(fd.entries());
 if(action==="close-modal"){closeModal();return;}
 if(action==="save-doc"){
  const d={id:"DC-"+String(data.docs.length+1).padStart(3,"0"),type:v.type,number:v.number,date:v.date,supplier:v.supplier,total:v.total?Number(v.total):null,currency:v.currency,status:v.status,sector:v.sector,operation:"",items:0};
  data.docs.unshift(d);save();closeModal();render();toast("Comprobante agregado a la bandeja de demostración.");return;
 }
 if(action==="save-purchase"){
  const id="OP-"+String(41+data.purchases.length).padStart(4,"0");
  data.purchases.unshift({id:id,supplier:v.supplier,date:v.date,sectors:[v.sector],docs:[],status:"Esperando documentación",receipt:"Pendiente",imputation:"Pendiente",description:v.description,items:[],history:[date(v.date)+" · Operación documental creada en demo"]});
  save();closeModal();render();toast("Operación creada en la demo.");return;
 }
 if(action==="save-article"){
  data.articles.push({id:"AR-"+String(data.articles.length+1).padStart(3,"0"),code:v.code,name:v.name,unit:v.unit,sectors:[v.sector],status:v.status,type:"Artículo",trace:"Pendiente",price:null});
  save();closeModal();render();toast("Artículo propuesto en la demo.");return;
 }
 if(action==="save-supplier"){
  const s={id:"PR-"+String(data.suppliers.length+1).padStart(3,"0"),name:v.name,trade:v.trade,tax:v.tax,city:v.city,status:"Provisional",docs:0,taxcondition:v.taxcondition,email:v.email};
  data.suppliers.push(s);save();closeModal();render();toast("Proveedor provisional creado en la demo.");return;
 }
 if(action==="save-service"){
  data.services.push({id:"SG-"+String(data.services.length+1).padStart(3,"0"),name:v.name,provider:v.provider,date:v.date,amount:Number(v.amount||0),sector:v.sector,status:v.status});
  save();closeModal();render();toast("Servicio/gasto agregado en la demo.");return;
 }
 if(action==="save-imputation"){
  const mode=v.mode,total=Number(v.total||0),qty=Number(v.quantity||0),vals=[Number(v.v1||0),Number(v.v2||0),Number(v.v3||0)],names=["Empaque","Frigorífico","Administración"];
  const sum=vals.reduce((a,b)=>a+b,0),target=mode==="Por porcentajes"?100:mode==="Por importes"?total:qty;
  if(Math.abs(sum-target)>.01){toast("La distribución suma "+sum+" y debe coincidir con "+target+" para la modalidad elegida.");return}
  const rows=vals.map((n,i)=>({sector:names[i],value:n,percent:mode==="Por porcentajes"?n:mode==="Por importes"?(total?n/total*100:0):(qty?n/qty*100:0),amount:mode==="Por importes"?n:total*(mode==="Por porcentajes"?n/100:(qty?n/qty:0))})).filter(x=>x.value>0);
  data.imputations.push({id:"IM-"+String(data.imputations.length+1).padStart(3,"0"),operation:v.operation.split(" · ")[0],concept:"Distribución de demo",mode:mode,total:total,rows:rows,status:"Pendiente de revisión"});
  save();closeModal();render();toast("Imputación guardada como pendiente de revisión.");return;
 }
}
function closeModal(){document.getElementById("modal-root").innerHTML=""}
function toast(msg){const root=document.getElementById("toast-root");root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>root.innerHTML="",2800)}
function exportCSV(type){
 let rows=[],name="informe-demo.csv";
 if(type==="docs"){rows=[["ID","Tipo","Numero","Fecha","Proveedor","Total","Sector","Estado"],...data.docs.map(d=>[d.id,d.type,d.number,d.date,d.supplier,d.total,d.sector,d.status])];name="comprobantes-demo.csv"}
 if(type==="articles"){rows=[["ID","Codigo","Descripcion","Unidad","Sectores","Estado"],...data.articles.map(a=>[a.id,a.code,a.name,a.unit,a.sectors.join(" / "),a.status])];name="articulos-demo.csv"}
 if(type==="imputations"){rows=[["ID","Operacion","Concepto","Modalidad","Sector","Importe","Participacion","Estado"]];data.imputations.forEach(m=>m.rows.forEach(r=>rows.push([m.id,m.operation,m.concept,m.mode,r.sector,r.amount,r.percent,m.status])));name="imputaciones-demo.csv"}
 const csv=rows.map(r=>r.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const a=document.createElement("a"),url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast("Exportación ficticia descargada.");
}
document.addEventListener("click",function(e){
 const nav=e.target.closest("[data-page]");if(nav){go(nav.dataset.page);return}
 const tab=e.target.closest("[data-detail-tab]");if(tab){detailTab=tab.dataset.detailTab;renderPurchaseDetail();return}
 const row=e.target.closest("[data-open]");if(row){detailId=row.dataset.open;detailTab="Resumen";page="compras";render();return}
 const a=e.target.closest("[data-action]");if(!a)return;
 const act=a.dataset.action;
 if(act==="go-compras")go("compras");
 if(act==="go-docs")go("comprobantes");
 if(act==="new-doc")newDoc();
 if(act==="new-purchase")newPurchase();
 if(act==="new-article")newArticle();
 if(act==="new-supplier")newSupplier();
 if(act==="new-service")newService();
 if(act==="new-imputation")newImputation(a.dataset.operation);
 if(act==="edit-imputation"){const im=data.imputations.find(x=>x.id===a.dataset.id);if(im)toast("La imputación "+im.id+" está disponible para consulta; edición detallada pendiente en esta demo.")}
 if(act==="doc-suggest")suggestions(a.dataset.doc);
 if(act==="suggest-link"){const x=data.purchases.find(x=>x.id===detailId);if(x){const d=data.docs.find(d=>d.id===x.docs[0]);if(d)suggestions(d.id);else toast("Esta operación no tiene comprobantes para sugerir.")}}
 if(act==="confirm-link"){const d=data.docs.find(x=>x.id===a.dataset.doc),p=data.purchases.find(x=>x.id===a.dataset.operation);if(d&&p){if(!p.docs.includes(d.id))p.docs.push(d.id);d.operation=p.id;d.status="Vinculado";p.history.unshift(date(new Date().toISOString().slice(0,10))+" · Documento "+d.id+" vinculado manualmente por usuario demo");save();closeModal();render();toast("Vínculo confirmado en la demo.")}}
 if(act==="supplier-detail")supplierDetail(a.dataset.id);
 if(act==="centralize-supplier"){const s=data.suppliers.find(x=>x.id===a.dataset.id);if(s){s.status="Alta central simulada";save();closeModal();render();toast("Alta central simulada. No se modificó ningún maestro real.")}}
 if(act==="back-purchases"){detailId=null;renderPurchases()}
 if(act==="close-modal")closeModal();
 if(act==="export-docs")exportCSV("docs");
 if(act==="export-articles")exportCSV("articles");
 if(act==="export-imputations")exportCSV("imputations");
 if(act==="reset"){if(confirm("¿Restablecer todos los datos ficticios de esta demo? Se borrarán solamente los cambios guardados en este navegador.")){data=clone(seed);save();render();toast("Datos de demostración restablecidos.")}}
});
document.addEventListener("submit",function(e){if(e.target.id==="modal-form"){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener("click",function(e){if(e.target.id==="modal-back")closeModal()});
function init(){
 if(!localStorage.getItem(KEY))save();
 render();
 document.getElementById("nav").insertAdjacentHTML("beforeend",'<button data-action="reset" style="margin-top:12px;color:#9b4b45"><span class="nav-ico">↺</span>Restablecer demo</button>');
}
init();
})();
</script>
</body>
</html>
